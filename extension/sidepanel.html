<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chrome Browser Bridge — Side Panel</title>
  <style>
    :root {
      --bg: #090b10;
      --surface: #11151f;
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: #181f2c;
      --text: #f3f4f6;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #3b82f6;
      --success: #10b981;
      --error: #ef4444;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100%;
      height: 100vh;
      padding: 16px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      background-color: var(--bg);
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--success);
      cursor: pointer;
    }

    .status-pill.offline {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.25);
      color: var(--error);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      padding: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .page-url {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .chip:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      padding: 5px 0;
    }

    .telemetry-row:not(:last-child) {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .telemetry-label { color: var(--text-dim); }
    .telemetry-val { font-weight: 600; color: #fff; }

    .tag-ok {
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      font-size: 10px;
      font-weight: 700;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--surface-border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn-primary {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.35);
      color: #93c5fd;
    }

    .btn-primary:hover {
      background: rgba(59, 130, 246, 0.25);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      margin-top: 4px;
    }

    th {
      text-align: left;
      padding: 6px 8px;
      color: var(--text-dim);
      font-weight: 600;
      border-bottom: 1px solid var(--surface-border);
      text-transform: uppercase;
      font-size: 10px;
    }

    td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">Bridge Side Panel</div>
    </div>
    <div id="statusPill" class="status-pill offline" title="Click to reconnect">
      <span class="dot"></span>
      <span id="statusLabel">Offline</span>
    </div>
  </header>

  <!-- Active Tab Card -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Focused Tab</span>
      <span id="reloadTabBtn" style="cursor:pointer; font-size:12px;" title="Reload tab">🔄</span>
    </div>
    <div id="pageTitle" class="page-title">Loading...</div>
    <div id="pageUrl" class="page-url">...</div>
    <div class="chip-row">
      <div id="chipTabId" class="chip" title="Click to copy tab ID">Tab ID: — 📋</div>
      <div id="chipWindowId" class="chip">Win: —</div>
    </div>
  </div>

  <!-- Agent Telemetry -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Agent Telemetry</span>
      <span id="metricP50" style="font-size:11px; color:#38bdf8; font-weight:600;">—</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Last Executed</span>
      <span id="lastActionName" class="telemetry-val">Ready</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Duration</span>
      <span id="lastActionDuration" class="telemetry-val">—</span>
    </div>
    <div class="telemetry-row">
      <span class="telemetry-label">Status</span>
      <span id="lastActionStatus" class="tag-ok">OK</span>
    </div>
  </div>

  <!-- Quick Pro Actions -->
  <div class="btn-grid">
    <button id="inspectBtn" class="btn btn-primary" title="Extract snapshot targets to clipboard">
      <span>🔍</span> Inspect Tree
    </button>
    <button id="highlightBtn" class="btn" title="Toggle visual element tags on tab">
      <span>🎯</span> Highlight
    </button>
    <button id="copyTokenBtn" class="btn" title="Copy Bearer token for CLI/MCP">
      <span>🔑</span> Copy Token
    </button>
    <button id="reloadExtBtn" class="btn" title="Hot-reload extension">
      <span>⚡</span> Reload Ext
    </button>
  </div>

  <!-- Recent Agent Action Log -->
  <div class="card" style="padding: 10px 12px; flex: 1;">
    <div class="card-header">
      <span class="card-title">Action Stream</span>
      <span id="actionCount" style="font-size:10px; color:var(--text-dim);">0 actions</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>Action</th>
          <th>Status</th>
          <th>RTT</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="streamBody">
        <tr><td colspan="4" style="text-align:center; color:var(--text-dim); padding:16px;">Waiting for actions...</td></tr>
      </tbody>
    </table>
  </div>

  <div id="toast" class="toast">Copied to clipboard</div>
  <script src="sidepanel.js"></script>
</body>
</html>
